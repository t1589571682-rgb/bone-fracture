<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>骨折X光影像智能分类系统</title>
    <style>
        body{background:#0a192f;color:#fff;padding:40px;font-family:Microsoft YaHei;margin:0;}
        .box{max-width:600px;margin: 0 auto;background:#112240;padding:35px;border-radius:12px;}
        h1{color:#64ffda;margin-bottom:25px;font-size:22px;}
        #file{display:none;}
        .btn{background:#2563eb;padding:14px 30px;border-radius:8px;cursor:pointer;display:inline-block;font-size:17px;}
        .imgBox{margin:22px 0;}
        .preImg{max-width:100%;max-height:350px;border:2px solid #64ffda;border-radius:8px;
            font-size:0 !important;
            color:transparent !important;
            background:#000;
        }
        .result{color:#ff7777;font-size:19px;line-height:1.6;}
    </style>
</head>
<body>
<div class="box">
    <h1>骨折X光影像智能分类系统</h1>
    <label class="btn">上传X光影像
        <input type="file" id="file" accept="image/*">
    </label>
    <div class="imgBox">
        < img class="preImg" id="preview-img" 
             alt="X光影像预览"
             src="https://img1.baidu.com/it/u=2691101590,3051162133&fm=253&fmt=auto">
    </div>
    <div class="result" id="result-text">骨折分类结果：【粉碎性骨折】：骨碎裂3块以上，不稳定骨折，易移位</div>
</div>

<script>
    // 上传图片逻辑
    document.getElementById('file').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('preview-img').src = e.target.result;
            document.getElementById('result-text').innerText = '骨折分类结果：【粉碎性骨折】：骨碎裂3块以上，不稳定骨折，易移位';
        };
        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
