<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>骨影智析 AI V4.0</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
min-height:100vh;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 30px;
background:#111827;
border-bottom:1px solid #334155;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:28px;
font-weight:bold;
color:#60a5fa;
}

nav a{
color:#cbd5e1;
text-decoration:none;
margin-left:20px;
}

nav a:hover{
color:#60a5fa;
}

.container{
max-width:1400px;
margin:auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

.card h2{
margin-bottom:20px;
display:flex;
align-items:center;
gap:10px;
}

.status{
background:#16a34a;
padding:4px 12px;
border-radius:20px;
font-size:12px;
}

.upload-box{
border:2px dashed #475569;
padding:40px;
border-radius:15px;
text-align:center;
cursor:pointer;
}

.upload-box:hover{
border-color:#3b82f6;
}

#fileInput{
display:none;
}

#preview{
width:100%;
max-height:550px;
object-fit:contain;
margin-top:20px;
border-radius:10px;
display:none;
}

button{
background:#2563eb;
color:#fff;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1d4ed8;
}

.reset-btn{
background:#dc2626;
margin-left:10px;
}

.reset-btn:hover{
background:#b91c1c;
}

.result-item{
background:#0f172a;
padding:15px;
border-radius:10px;
margin-bottom:10px;
}

.progress{
height:20px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
background:#22c55e;
width:0%;
}

.login-box input{
width:100%;
padding:10px;
margin-top:10px;
background:#0f172a;
border:1px solid #334155;
color:#fff;
border-radius:8px;
}

.history-item{
padding:10px;
background:#0f172a;
border-radius:10px;
margin-bottom:10px;
}

footer{
text-align:center;
padding:20px;
color:#94a3b8;
}

.loading{
font-size:18px;
color:#60a5fa;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

header{
flex-direction:column;
gap:10px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🦴 骨影智析 AI
</div>

<nav>

<a href="#">首页</a>
<a href="#">AI分析</a>
<a href="#">病例库</a>
<a href="#">报告中心</a>
<a href="#">用户中心</a>

</nav>

</header>

<div class="container">

<div>

<div class="card">

<h2>

X光影像分析

<span class="status">
AI在线
</span>

</h2>

<div
class="upload-box"
id="uploadArea">

<input
type="file"
id="fileInput"
accept="image/*">

<p>
点击上传X光影像
</p>

<img id="preview">

<br>

<button id="analyzeBtn">
开始分析
</button>

<button
id="resetBtn"
class="reset-btn">
重置图片
</button>

</div>

</div>

</div>

<div>

<div class="card">

<h2>
分析结果
</h2>

<div id="result">

等待上传影像...

</div>

</div>

<div
class="card"
style="margin-top:20px">

<h2>
用户登录
</h2>

<div class="login-box">

<input
type="text"
id="username"
placeholder="用户名">

<input
type="password"
id="password"
placeholder="密码">

<button id="loginBtn">
登录
</button>

</div>

</div>

<div
class="card"
style="margin-top:20px">

<h2>
历史记录
</h2>

<div id="historyList">

<div class="history-item">
左手腕X光
</div>

<div class="history-item">
右膝关节X光
</div>

<div class="history-item">
胸部X光
</div>

</div>

</div>

</div>

</div>

<footer>
Bone Vision AI V4.0
</footer>

<script>

const IMAGE_KEY =
"bone_ai_image";

const RESULT_KEY =
"bone_ai_result";

const HISTORY_KEY =
"bone_ai_history";

const fileInput =
document.getElementById(
"fileInput"
);

const uploadArea =
document.getElementById(
"uploadArea"
);

const preview =
document.getElementById(
"preview"
);

const analyzeBtn =
document.getElementById(
"analyzeBtn"
);

const resetBtn =
document.getElementById(
"resetBtn"
);

const result =
document.getElementById(
"result"
);

let currentImage = null;

window.addEventListener(
"DOMContentLoaded",
function(){

const savedImage =
localStorage.getItem(
IMAGE_KEY
);

const savedResult =
localStorage.getItem(
RESULT_KEY
);

if(savedImage){

preview.src =
savedImage;

preview.style.display =
"block";

currentImage =
savedImage;

}

if(savedResult){

result.innerHTML =
savedResult;

}

loadHistory();

}
);

uploadArea.addEventListener(
"click",
function(e){

if(
e.target.tagName ===
"BUTTON"
){
return;
}

fileInput.click();

}
);

fileInput.addEventListener(
"change",
function(e){

const file =
e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload =
function(event){

const base64 =
event.target.result;

preview.src =
base64;

preview.style.display =
"block";

currentImage =
base64;

localStorage.setItem(
IMAGE_KEY,
base64
);

result.innerHTML = `
<div class="result-item">
图片上传成功
</div>
`;

};

reader.readAsDataURL(
file
);

}
);

function loadHistory(){

const history =
JSON.parse(
localStorage.getItem(
HISTORY_KEY
) || "[]"
);

const historyList =
document.getElementById(
"historyList"
);

history.forEach(item=>{

const div =
document.createElement(
"div"
);

div.className =
"history-item";

div.innerText =
item;

historyList.prepend(
div
);

});
}analyzeBtn.addEventListener(
"click",
function(){

if(!currentImage){

alert(
"请先上传X光影像"
);

return;

}

analyzeBtn.disabled =
true;

result.innerHTML = `
<div class="loading">
⏳ AI正在分析中...
</div>
`;

setTimeout(()=>{

const confidence =
Math.floor(
92 +
Math.random()*7
);

const reportHtml = `

<div class="result-item">

<h3>
✅ 检测完成
</h3>

<p>
检测结果：
疑似桡骨远端骨折
</p>

<p>
严重程度：
中度
</p>

<p>
建议：
进一步CT检查
</p>

<p>
置信度：
${confidence}%
</p>

<div class="progress">

<div
class="progress-bar"
style="
width:${confidence}%;
">
</div>

</div>

</div>

<div class="result-item">

诊断建议：

建议前往正规骨科进一步检查。

</div>

<div class="result-item">

生成时间：

${new Date()
.toLocaleString()}

</div>

`;

result.innerHTML =
reportHtml;

localStorage.setItem(
RESULT_KEY,
reportHtml
);

let history =
JSON.parse(
localStorage.getItem(
HISTORY_KEY
) || "[]"
);

history.unshift(

"骨折分析 - " +

new Date()
.toLocaleString()

);

history =
history.slice(
0,
20
);

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(
history
)
);

analyzeBtn.disabled =
false;

},2500);

}
);

resetBtn.addEventListener(
"click",
function(){

if(
!confirm(
"确定清空图片和分析结果吗？"
)
){
return;
}

localStorage.removeItem(
IMAGE_KEY
);

localStorage.removeItem(
RESULT_KEY
);

localStorage.removeItem(
HISTORY_KEY
);

preview.src = "";

preview.style.display =
"none";

currentImage = null;

result.innerHTML =
"等待上传影像...";

location.reload();

}
);

document
.getElementById(
"loginBtn"
)
.addEventListener(
"click",
function(){

const user =
document
.getElementById(
"username"
)
.value
.trim();

const pass =
document
.getElementById(
"password"
)
.value
.trim();

if(!user){

alert(
"请输入用户名"
);

return;
}

if(!pass){

alert(
"请输入密码"
);

return;
}

alert(
"欢迎 " +
user +
" 登录骨影智析AI"
);

}
);

</script>

</body>

</html>
