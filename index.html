```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骨折X光影像智能分类系统</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei";
}

body{
background:#16284d;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:1000px;
background:#223a69;
padding:30px;
border-radius:20px;
}

.title{
text-align:center;
font-size:42px;
font-weight:bold;
color:#63ffd8;
margin-bottom:25px;
}

.upload-btn{
display:block;
width:280px;
margin:auto;
background:#0ea5ff;
padding:18px;
text-align:center;
color:white;
font-size:24px;
border-radius:12px;
cursor:pointer;
border:2px solid white;
margin-bottom:25px;
}

#fileInput{
display:none;
}

.image-box{
width:100%;
height:550px;
border:4px solid #54ffe9;
border-radius:15px;
overflow:hidden;
background:black;
display:flex;
justify-content:center;
align-items:center;
}

.image-box img{
width:100%;
height:100%;
object-fit:contain;
}

.result{
margin-top:25px;
font-size:32px;
font-weight:bold;
color:#ff8e8e;
line-height:1.5;
}

.tip{
margin-top:15px;
color:#ffffff;
font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
骨折X光影像智能分类系统
</div>

<label class="upload-btn" for="fileInput">
上传X光影像
</label>

<input type="file" id="fileInput" accept="image/*">

<div class="image-box">

<img
id="previewImg"
src="foot-fracture.jpg"
alt="X光影像">

</div>

<div
class="result"
id="result">

骨折分类结果：【粉碎性骨折】：骨碎裂3块以上，不稳定骨折，易移位

</div>

<div class="tip">
首次上传后，图片会自动保存，下次打开网站直接显示。
</div>

</div>

<script>

const fileInput =
document.getElementById("fileInput");

const previewImg =
document.getElementById("previewImg");

const result =
document.getElementById("result");

window.onload=function(){

const savedImage =
localStorage.getItem("savedImage");

const savedResult =
localStorage.getItem("savedResult");

if(savedImage){

previewImg.src=savedImage;

}

if(savedResult){

result.innerHTML=savedResult;

}

}

fileInput.addEventListener("change",function(){

const file=this.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(e){

const imageData=e.target.result;

previewImg.src=imageData;

localStorage.setItem(
"savedImage",
imageData
);

const analysisText=
"骨折分类结果：【粉碎性骨折】：骨碎裂3块以上，不稳定骨折，易移位";

result.innerHTML=
analysisText;

localStorage.setItem(
"savedResult",
analysisText
);

};

reader.readAsDataURL(file);

});

</script>

</body>
</html>
