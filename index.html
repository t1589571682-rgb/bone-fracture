```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骨折X光影像智能分类系统</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",sans-serif;
}

body{
background:#0f172a;
padding:30px;
color:white;
}

.container{
max-width:1400px;
margin:auto;
}

.title{
text-align:center;
font-size:38px;
font-weight:bold;
color:#4ade80;
margin-bottom:30px;
}

.main{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.left{
flex:1.4;
min-width:500px;
}

.right{
flex:0.8;
min-width:320px;
}

.card{
background:#1e293b;
border-radius:15px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 20px rgba(0,255,255,.15);
}

.card h2{
margin-bottom:15px;
color:#38bdf8;
}

.upload-btn{
display:block;
width:100%;
padding:15px;
font-size:18px;
background:#0ea5e9;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
margin-bottom:20px;
}

.upload-btn:hover{
background:#0284c7;
}

#fileInput{
display:none;
}

.preview-box{
width:100%;
height:600px;
border:3px solid #22d3ee;
border-radius:12px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
background:black;
}

.preview-box img{
max-width:100%;
max-height:100%;
display:none;
}

.placeholder{
color:#94a3b8;
font-size:20px;
}

.result-item{
margin-bottom:20px;
}

.label{
color:#94a3b8;
margin-bottom:6px;
}

.value{
font-size:20px;
font-weight:bold;
}

.high{
color:#ef4444;
}

.progress{
width:100%;
height:12px;
background:#334155;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:92%;
background:#22c55e;
}

.footer{
text-align:center;
margin-top:30px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="container">

<div class="title">
骨折X光影像智能分类系统
</div>

<div class="main">

<div class="left">

<div class="card">

<label class="upload-btn" for="fileInput">
上传X光影像
</label>

<input
type="file"
id="fileInput"
accept="image/*">

<div class="preview-box">

<img id="previewImg">

<div class="placeholder" id="placeholder">
等待上传X光影像...
</div>

</div>

</div>

</div>

<div class="right">

<div class="card">

<h2>AI分析结果</h2>

<div class="result-item">
<div class="label">骨折分类</div>
<div class="value high">
粉碎性骨折
</div>
</div>

<div class="result-item">
<div class="label">检测置信度</div>

<div class="progress">
<div class="bar"></div>
</div>

<div class="value">
92.4%
</div>
</div>

<div class="result-item">
<div class="label">骨折说明</div>
<div class="value">
骨碎裂3块以上，不稳定骨折，易发生移位。
</div>
</div>

</div>

<div class="card">

<h2>临床建议</h2>

<div class="value">
建议结合放射科医师诊断结果，
必要时进行CT进一步检查，
并由骨科专科医师评估治疗方案。
</div>

</div>

</div>

</div>

<div class="footer">
Powered By Bone Fracture AI Analysis System
</div>

</div>

<script>

const fileInput =
document.getElementById("fileInput");

const previewImg =
document.getElementById("previewImg");

const placeholder =
document.getElementById("placeholder");

fileInput.addEventListener("change",function(e){

const file = e.target.files[0];

if(file){

const reader = new FileReader();

reader.onload = function(event){

previewImg.src =
event.target.result;

previewImg.style.display =
"block";

placeholder.style.display =
"none";

};

reader.readAsDataURL(file);

}

});

</script>

</body>
</html>
```
