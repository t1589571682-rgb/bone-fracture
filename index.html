<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>骨影智析 AI V3.0</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#111827;
border-bottom:1px solid #334155;
}

.logo{
font-size:28px;
font-weight:bold;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
}

nav a:hover{
color:#60a5fa;
}

.container{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
border-radius:15px;
padding:20px;
}

h2{
margin-bottom:20px;
}

.upload-box{
border:2px dashed #475569;
border-radius:15px;
padding:40px;
text-align:center;
cursor:pointer;
}

.upload-box:hover{
border-color:#3b82f6;
}

#preview{
width:100%;
max-height:600px;
object-fit:contain;
margin-top:20px;
display:none;
border-radius:10px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1d4ed8;
}

.result-item{
padding:12px;
margin-bottom:10px;
background:#0f172a;
border-radius:10px;
}

.progress{
height:20px;
background:#334155;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#22c55e;
transition:1s;
}

.history-item{
padding:10px;
background:#0f172a;
margin-bottom:10px;
border-radius:10px;
}

.login-box input{
width:100%;
padding:10px;
margin-top:10px;
background:#0f172a;
border:1px solid #334155;
color:white;
border-radius:8px;
}

.status{
display:inline-block;
padding:5px 10px;
background:#16a34a;
border-radius:20px;
font-size:12px;
}

footer{
text-align:center;
padding:20px;
margin-top:20px;
color:#94a3b8;
}

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
🦴 骨影智析 AI
</div>

<nav>

<a href="#">首页</a>

<a href="#">AI分析</a>

<a href="#">病例库</a>

<a href="#">报告中心</a>

<a href="#">用户中心</a>

</nav>

</header>

<div class="container">

<div>

<div class="card">

<h2>
X光影像分析
<span class="status">AI在线</span>
</h2>

<div class="upload-box">

<input
type="file"
id="fileInput"
accept="image/*"
>

<p style="margin-top:15px">
上传X光影像
</p>

<img id="preview">

<button id="analyzeBtn">
开始分析
</button>

</div>

</div>

</div>

<div>

<div class="card">

<h2>分析结果</h2>

<div id="result">

等待上传影像...

</div>

</div>

<div class="card" style="margin-top:20px">

<h2>用户登录</h2>

<div class="login-box">

<input
type="text"
placeholder="用户名"
>

<input
type="password"
placeholder="密码"
>

<button>
登录
</button>

</div>

</div>

<div class="card" style="margin-top:20px">

<h2>历史记录</h2>

<div class="history-item">
左手腕X光
</div>

<div class="history-item">
右膝关节X光
</div>

<div class="history-item">
胸部X光
</div>

</div>

</div>

</div>

<footer>

Bone Vision AI V3.0

</footer>

<script>

const fileInput =
document.getElementById("fileInput");

const preview =
document.getElementById("preview");

const analyzeBtn =
document.getElementById("analyzeBtn");

const result =
document.getElementById("result");

let currentFile = null;

fileInput.addEventListener(
"change",
function(e){

currentFile =
e.target.files[0];

if(!currentFile) return;

preview.src =
URL.createObjectURL(currentFile);

preview.style.display="block";

}
);

analyzeBtn.addEventListener(
"click",
function(){

if(!currentFile){

alert("请先上传影像");

return;

}

result.innerHTML = `
<h3>AI分析中...</h3>
`;

setTimeout(()=>{

const confidence =
Math.floor(
90 + Math.random()*9
);

result.innerHTML = `

<div class="result-item">

<h3>
检测完成
</h3>

<p>
检测结果：
疑似桡骨远端骨折
</p>

<p>
严重程度：
中度
</p>

<p>
建议：
进一步CT检查
</p>

<p>
置信度：
${confidence}%
</p>

<div class="progress">

<div
class="progress-bar"
style="width:${confidence}%"
></div>

</div>

</div>

<div class="result-item">

诊断建议：

建议前往骨科进一步检查。

</div>

<div class="result-item">

生成时间：

${new Date().toLocaleString()}

</div>

`;

},2500);

}
);

</script>

</body>
</html>
