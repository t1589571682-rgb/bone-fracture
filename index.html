<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骨折X光影像智能分类系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a192f;
            color: #fff;
            font-family: "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #112240;
            border-radius: 12px;
            padding: 35px;
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #64ffda;
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
        }
        .upload-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            margin: 0 auto 22px;
            font-size: 17px;
        }
        .img-container {
            width: 100%;
            height: 350px;
            border: 2px solid #64ffda;
            border-radius: 8px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 22px;
        }
        #preview-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* 强制禁止显示文本内容，解决标签乱码问题 */
            font-size: 0 !important;
            color: transparent !important;
        }
        .result-text {
            color: #ff7777;
            font-size: 19px;
            line-height: 1.6;
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>骨折X光影像智能分类系统</h1>
        
        <input type="file" id="file-input" accept="image/*">
        <button class="upload-btn" onclick="document.getElementById('file-input').click()">上传X光影像</button>

        <div class="img-container">
            <!-- 这里用你已经上传的foot-fracture.jpg，路径完全正确 -->
            < img id="preview-img" 
                 src="./foot-fracture.jpg" 
                 alt="X光影像预览">
        </div>

        <div class="result-text">
            骨折分类结果：【粉碎性骨折】：骨碎裂3块以上，不稳定骨折，易移位
        </div>
    </div>

    <script>
        // 上传图片逻辑（不影响默认显示）
        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview-img').src = e.target.result;
                document.querySelector('.result-text').innerText = 
                    '骨折分类结果：【粉碎性骨折】：骨碎裂3块以上，不稳定骨折，易移位';
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
